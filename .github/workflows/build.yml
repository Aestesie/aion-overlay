# The Windows installer, built on a GitHub runner, with the engine (engine/, Rust) it runs.
#
#   git tag v0.2.0-offline.1 && git push origin v0.2.0-offline.1
#       builds, and attaches the installer and its SHA-256 to a release named after the tag
#   Actions → Build → Run workflow
#       builds only: the installer is kept as the run's artifact
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Engine tests
        working-directory: engine
        run: cargo test --locked

      - name: App dependencies
        working-directory: app
        run: npm ci

      # build/ is not in the repo: the icon is drawn by a script.
      - name: Icon
        working-directory: app
        run: npm run icon

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Installer
        working-directory: app
        run: npm run dist

      - name: Checksum
        id: sum
        working-directory: app/dist
        run: |
          $exe = Get-ChildItem Lokthar-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.Name).sha256"
          "exe=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          $zip = Get-ChildItem Lokthar-*-portable.zip | Select-Object -First 1
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $($zip.Name)" | Out-File -Encoding ascii "$($zip.Name).sha256"
          "zip=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "ziphash=$zipHash" >> $env:GITHUB_OUTPUT
          # The installer again, zipped: for browsers and chats that block a bare .exe.
          $version = $exe.BaseName -replace '^Lokthar-Setup-', ''
          $inst = "Lokthar-$version-installer.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $inst
          $instHash = (Get-FileHash $inst -Algorithm SHA256).Hash.ToLower()
          "$instHash  $inst" | Out-File -Encoding ascii "$inst.sha256"
          "inst=$inst" >> $env:GITHUB_OUTPUT
          "insthash=$instHash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            app/dist/${{ steps.sum.outputs.exe }}
            app/dist/${{ steps.sum.outputs.exe }}.sha256
            app/dist/${{ steps.sum.outputs.exe }}.blockmap
            app/dist/latest.yml
            app/dist/${{ steps.sum.outputs.zip }}
            app/dist/${{ steps.sum.outputs.zip }}.sha256
            app/dist/${{ steps.sum.outputs.inst }}
            app/dist/${{ steps.sum.outputs.inst }}.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app/dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.sum.outputs.exe }}
          HASH: ${{ steps.sum.outputs.hash }}
          ZIP: ${{ steps.sum.outputs.zip }}
          ZIPHASH: ${{ steps.sum.outputs.ziphash }}
          INST: ${{ steps.sum.outputs.inst }}
          INSTHASH: ${{ steps.sum.outputs.insthash }}
        run: |
          # latest.yml (and the blockmap) are what the app's updater reads: Settings → Updates.
          gh release create "$GITHUB_REF_NAME" "$EXE" "$EXE.sha256" "$EXE.blockmap" latest.yml "$ZIP" "$ZIP.sha256" "$INST" "$INST.sha256" \
            --title "Lokthar overlay $GITHUB_REF_NAME" \
            --notes "Lokthar overlay from commit $GITHUB_SHA. No shared timers, no machine id. It goes online only for the optional Lokthar field boss sync (off by default) and when you check for updates (Settings → Updates).

          Needs [Npcap](https://npcap.com) installed first. The installer is not code-signed: Windows may say \"Windows protected your PC\", choose More info → Run anyway.

          **Installer in a zip:** \`$INST\` holds the same \`$EXE\`, for browsers or chats that block downloading an .exe.

          **Portable:** \`$ZIP\` is the same app without an installer: unpack it anywhere and run \`Aion2DropTracker.exe\`. To update it, unpack a newer zip over the folder (your settings and data are kept in %APPDATA%\\Lokthar).

          SHA-256 of \`$EXE\`: \`$HASH\`
          SHA-256 of \`$ZIP\`: \`$ZIPHASH\`
          SHA-256 of \`$INST\`: \`$INSTHASH\`"
