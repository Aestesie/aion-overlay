# Windows installer: per-user NSIS (no admin rights), like marnis-app's; and the same app as a zip
# to unpack and run anywhere, without installing (the portable copy: main/updater.ts tells them apart).
#
#   npm run dist      -> dist/Lokthar-Setup-<version>.exe, dist/Lokthar-<version>-portable.zip
#
# The engine (capture, tracking and the DPS meter) is the Rust build in ../build/engine; npm run dist
# builds it first (scripts/build-engine.mjs). Npcap is not bundled: its licence does not allow it, and
# the app tells the user to install it.
# appId, executableName and the package name (the install folder) are kept from the first release:
# the installed copy is found by them, so a new build installs over the old one. The product name
# was renamed in 0.1.11, 0.2.0 and 0.3.0 (Nyerk -> Lokthar).
appId: com.xcrov.aion2-drop-tracker
productName: Lokthar
executableName: Aion2DropTracker
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../build/engine
    to: engine
    filter: ['**/*']
asar: true
electronLanguages: [en-US]
win:
  target: [nsis, zip]
  icon: build/icon.ico
  # The zip's name (the installer has its own, below).
  artifactName: Lokthar-${version}-portable.${ext}
# Where the installed app looks for updates (Settings → Updates, by hand only): the latest release
# of this repo. The build writes latest.yml next to the installer; the release workflow attaches
# both. The repo must be public for the app to read its releases.
publish:
  provider: github
  owner: matiasmoya
  repo: aion-overlay
  releaseType: release
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Lokthar
  artifactName: Lokthar-Setup-${version}.${ext}
